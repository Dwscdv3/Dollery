<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixiv 收藏查看器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="toolbar">
  <div class="tabs" id="tabs"></div>

  <div class="filters">
    <input id="search" type="search" placeholder="搜索标题 / 作者 / pid" autocomplete="off">
    <select id="tagFilter"><option value="">全部收藏标签</option></select>
    <label class="chip"><input type="checkbox" id="missingOnly"> 只看未下载</label>
    <label class="chip"><input type="checkbox" id="showRemoved"> 含已取消</label>
  </div>

  <div class="meta">
    <label class="chip" title="滚动时自动把视口内未下载的作品加入下载队列">
      <input type="checkbox" id="autoDownload" checked> 可见即下载
    </label>
    <span id="queueState" class="queue-state"></span>
    <span id="counter">—</span>
    <a class="meta-link" href="/downloader.html" target="_blank" rel="noopener" title="打开下载管理器">下载管理</a>
    <button id="reload" title="重新读取磁盘上的图片">刷新</button>
  </div>
</header>

<main id="grid" class="grid" aria-live="polite"></main>

<div id="sentinel" class="sentinel"></div>

<div id="statusbar" class="statusbar"></div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-stage" id="lbStage">
    <img id="lbImage" alt="">
  </div>
  <button class="lb-btn lb-close" id="lbClose" title="关闭 (Esc)">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" title="上一个 (←)">‹</button>
  <button class="lb-btn lb-next" id="lbNext" title="下一个 (→)">›</button>
  <div class="lb-bar">
    <span id="lbTitle"></span>
    <span id="lbMeta"></span>
    <span id="lbZoom"></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
