<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixiv 收藏查看器</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="toolbar">
  <div class="tabs" id="tabs"></div>

  <div class="filters">
    <input id="search" type="search" placeholder="搜索 / 布尔：foo AND (bar OR baz) NOT qux" autocomplete="off" spellcheck="false">
    <select id="sortMode" title="排序方式">
      <option value="asc">最早收藏在前</option>
      <option value="desc">最新收藏在前</option>
      <option value="random">随机顺序</option>
    </select>
    <button id="btnView" class="icon-btn" title="视图设置">⚙</button>
  </div>

  <div class="meta">
    <span id="queueState" class="queue-state"></span>
    <span id="counter">—</span>
    <button id="reload" class="icon-btn" title="刷新">⟳</button>
  </div>
</header>

<div class="app-body">
  <aside class="side side-left" id="sideLeft">
    <div class="side-tabs" id="sideTabs">
      <button data-panel="authors" class="active">作者</button>
      <button data-panel="tags">标签</button>
    </div>
    <input id="sideQuery" class="side-query" placeholder="筛选…" autocomplete="off" spellcheck="false">
    <div class="side-list" id="sideList"></div>
  </aside>

  <div class="grid-wrap">
    <main class="grid" id="grid" aria-live="polite"></main>
    <div id="sentinel" class="sentinel"></div>
  </div>

  <aside class="side side-right" id="sideRight">
    <div class="side-head">下载管理</div>
    <div class="dl-summary" id="dlSummary"></div>
    <div class="dl-bar"><div class="dl-bar-fill" id="dlBar"></div></div>
    <div class="dl-meta" id="dlMeta">—</div>
    <div class="dl-actions">
      <button id="dlAll" class="primary">全部下载</button>
      <button id="dlClear">清空</button>
      <button id="dlVerify" title="逐个读取文件头，检查图片是否损坏">校验</button>
    </div>
    <div class="side-sub">按来源</div>
    <div class="dl-sources" id="dlSources"></div>
    <div id="dlFails"></div>
  </aside>
</div>

<div id="statusbar" class="statusbar"></div>

<div class="popover" id="viewPopover" hidden>
  <div class="pop-title">视图设置</div>

  <div class="pop-field">
    <span class="pop-label">封面比例</span>
    <div class="seg" id="optRatio">
      <button data-v="auto" class="on">原图</button>
      <button data-v="3:4">3:4</button>
      <button data-v="1:1">1:1</button>
      <button data-v="4:3">4:3</button>
      <button data-v="16:9">16:9</button>
    </div>
  </div>

  <div class="pop-field">
    <span class="pop-label">卡片宽度 <b id="optWidthVal">210px</b></span>
    <input type="range" id="optWidth" min="140" max="340" step="10">
  </div>

  <label class="switch">
    <input type="checkbox" id="optShowOwnTags">
    <span class="track"></span>
    <span class="switch-text">显示收藏标签</span>
  </label>

  <label class="switch">
    <input type="checkbox" id="optShowTags">
    <span class="track"></span>
    <span class="switch-text">显示作品标签</span>
  </label>

  <label class="switch">
    <input type="checkbox" id="optAutoDownload">
    <span class="track"></span>
    <span class="switch-text">可见即下载</span>
  </label>

  <div class="pop-foot"><button id="optReset">恢复默认</button></div>
</div>

<button class="edge-toggle edge-left" id="edgeLeft" title="作者 / 标签">›</button>
<button class="edge-toggle edge-right" id="edgeRight" title="下载管理">‹</button>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-stage" id="lbStage">
    <img id="lbImage" alt="">
  </div>

  <aside class="lb-pages" id="lbPages"></aside>
  <aside class="lb-panel" id="lbPanel"></aside>

  <button class="lb-btn lb-close" id="lbClose" title="关闭 (Esc)">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" title="上一个 (←)">‹</button>
  <button class="lb-btn lb-next" id="lbNext" title="下一个 (→)">›</button>

  <div class="lb-bar">
    <span id="lbTitle"></span>
    <span id="lbMeta"></span>
    <span id="lbZoom"></span>
  </div>
</div>

<div id="reader" class="reader" hidden>
  <aside class="rd-side">
    <div class="rd-cover" id="rdCoverBox">
      <img id="rdCover" alt="">
    </div>
    <h3 id="rdTitle"></h3>
    <div class="rd-author" id="rdAuthor"></div>
    <div class="rd-tags" id="rdTags"></div>
    <a id="rdLink" target="_blank" rel="noopener">在 pixiv 打开 →</a>
  </aside>
  <div class="rd-body" id="rdBody"></div>
  <button class="lb-btn lb-close" id="rdClose" title="关闭 (Esc)">✕</button>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
