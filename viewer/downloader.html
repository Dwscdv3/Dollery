<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载管理器 — Pixiv 收藏</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="downloader.css">
</head>
<body class="dl-body">

<header class="dl-header">
  <div class="dl-title">
    <h1>下载管理器</h1>
    <span id="connState" class="dl-conn">连接中…</span>
  </div>
  <a class="dl-back" href="/">← 返回查看器</a>
</header>

<main class="dl-main">

  <section class="dl-card">
    <h2>总览</h2>
    <div class="dl-stats" id="stats"></div>
  </section>

  <section class="dl-card">
    <h2>队列</h2>
    <div class="dl-progress">
      <div class="dl-bar"><div class="dl-bar-fill" id="barFill"></div></div>
      <div class="dl-queue-meta" id="queueMeta">—</div>
    </div>

    <div class="dl-actions">
      <button id="btnAll" class="primary">下载全部未下载</button>
      <button id="btnClear">清空队列</button>
      <button id="btnVerify">校验图库完整性</button>
    </div>

    <div class="dl-hint" id="hint"></div>
  </section>

  <section class="dl-card">
    <h2>按来源批量下载</h2>
    <div class="dl-sources" id="sources"></div>
  </section>

  <section class="dl-card" id="failCard" hidden>
    <h2>失败 <span id="failCount" class="dl-badge"></span></h2>
    <ul class="dl-fails" id="failList"></ul>
  </section>

  <section class="dl-card" id="verifyCard" hidden>
    <h2>校验结果</h2>
    <div id="verifyBody"></div>
  </section>

</main>

<script src="downloader.js"></script>
</body>
</html>
