<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按作者浏览 — Pixiv 收藏</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="downloader.css">
</head>
<body class="dl-body">

<header class="dl-header">
  <div class="dl-title">
    <h1>按作者浏览</h1>
    <span id="count" class="dl-conn">—</span>
  </div>
  <a class="dl-back" href="/">← 返回查看器</a>
</header>

<main class="dl-main">

  <section class="dl-card">
    <div class="au-toolbar">
      <input id="q" type="search" placeholder="搜索作者名 / 布尔：foo AND (bar OR baz)" autocomplete="off" spellcheck="false">
      <select id="source"><option value="">全部来源</option></select>
    </div>
    <div class="dl-hint" id="hint">默认按收藏作品数从多到少排列。点作者可跳到查看器看他/她的全部收藏。</div>
  </section>

  <section class="dl-card">
    <div class="au-list" id="list"></div>
  </section>

</main>

<script src="authors.js"></script>
</body>
</html>
